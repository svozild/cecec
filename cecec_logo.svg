<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100%"
   viewBox="0 0 640 156"
   role="img"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>CECEC logo</title>
  <desc>Logo CECEC – Central and Eastern European Cheminformatics Conference. Where chemistry meets data.</desc>

  <!-- Ikona: hexagon uzel (chemie + data) -->
  <g transform="translate(20,44) scale(1.2)" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <polygon
       points="30,0 60,17 60,52 30,69 0,52 0,17"
       stroke="#00C6D7"
       stroke-width="2.5" />
    <circle cx="30" cy="34" r="5" fill="#00C6D7" />
    <line x1="30" y1="34" x2="30" y2="0"  stroke="#00C6D7" stroke-width="1.5" opacity="0.5" />
    <line x1="30" y1="34" x2="60" y2="17" stroke="#00C6D7" stroke-width="1.5" opacity="0.5" />
    <line x1="30" y1="34" x2="60" y2="52" stroke="#00C6D7" stroke-width="1.5" opacity="0.5" />
    <line x1="30" y1="34" x2="30" y2="69" stroke="#00C6D7" stroke-width="1.5" opacity="0.5" />
    <line x1="30" y1="34" x2="0"  y2="52" stroke="#00C6D7" stroke-width="1.5" opacity="0.5" />
    <line x1="30" y1="34" x2="0"  y2="17" stroke="#00C6D7" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Textový blok, sjednocené odsazení a hierarchie velikostí -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="132" y="76" font-size="46" font-weight="800" letter-spacing="1.5" fill="#111111">CECEC</text>

    <text x="133" y="101" font-size="15" font-weight="600" letter-spacing="0.3" fill="#4a4a47">Central &amp; Eastern European Cheminformatics Conference</text>

    <line x1="133" y1="112" x2="560" y2="112" stroke="#00C6D7" stroke-width="1" opacity="0.35" />

    <text x="133" y="134" font-size="15" font-style="italic" font-weight="500" letter-spacing="0.2" fill="#00C6D7">Where chemistry meets data</text>
  </g>
</svg>
